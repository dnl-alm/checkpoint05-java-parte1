<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title th:text="${modoEdicao} ? 'Editar produto · Mercado Express' : 'Novo produto · Mercado Express'"></title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/mercado.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: cabecalho}"></div>

<main class="container container--estreito">
    <a th:href="@{/mercados}" class="link-voltar">&larr; Voltar</a>
    <h1 th:text="${modoEdicao} ? 'Editar produto' : 'Novo produto'"></h1>

    <form class="ficha"
          th:action="${modoEdicao} ? @{/mercados/{id}/atualizar(id=${id})} : @{/mercados}"
          th:object="${mercadoForm}" method="post">

        <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" th:field="*{nome}" placeholder="Ex: Água mineral 1,5L">
        </div>
        <div class="campo">
            <label for="tipo">Tipo</label>
            <input type="text" id="tipo" th:field="*{tipo}" placeholder="Ex: bebidas">
        </div>
        <div class="campo-grupo">
            <div class="campo">
                <label for="setor">Setor</label>
                <input type="text" id="setor" th:field="*{setor}" placeholder="Ex: A1">
            </div>
            <div class="campo">
                <label for="tamanho">Tamanho</label>
                <input type="number" step="0.01" id="tamanho" th:field="*{tamanho}">
            </div>
            <div class="campo">
                <label for="preco">Preço (R$)</label>
                <input type="number" step="0.01" id="preco" th:field="*{preco}">
            </div>
        </div>

        <div class="ficha__acoes">
            <button type="submit" class="botao botao--primario">Salvar</button>
            <a th:href="@{/mercados}" class="botao botao--secundario">Cancelar</a>
        </div>
    </form>
</main>

</body>
</html>
